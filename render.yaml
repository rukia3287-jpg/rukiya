services:
- type: web
  name: rukiya-bot
  env: python
  region: oregon
  plan: free
  buildCommand: pip install -r requirements.txt
  startCommand: python main.py
  healthCheckPath: /health
  envVars:
    - key: DISCORD_TOKEN
      sync: false
    - key: OPENROUTER_API_KEY
      sync: false
    - key: OPENROUTER_MODEL
      sync: false
    - key: GEMINI_API_KEY
      sync: false
    - key: GEMINI_MODEL
      value: gemini-3.5-flash-lite
    - key: RUKIYA_TEMP
      value: "0.85"
    - key: GEMINI_SEARCH_ENABLED
      value: "true"
    - key: GEMINI_SEARCH_DAILY_LIMIT
      value: "450"
    - key: YOUTUBE_VIDEO_ID
      sync: false
    - key: RUKIYA_AUTO_REPLY
      value: "true"
    - key: CLIENT_SECRET_JSON
      sync: false
    - key: TOKEN_JSON
      sync: false
    - key: PYTHON_VERSION
      value: 3.11.5
  scaling:
    minInstances: 1
    maxInstances: 1
